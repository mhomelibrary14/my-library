<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>MY LIBRARY</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        sans-serif;

      text-align: center;
      margin: 0;
      padding: 30px 20px;
      background: #fafafa;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #666;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 30px auto;
    }

    button {
      font-size: 18px;
      padding: 14px 30px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
      cursor: pointer;
    }

    .message {
      margin-top: 20px;
      font-size: 16px;
      color: #555;
    }

    video {
      width: 100%;
      max-width: 500px;
      border-radius: 12px;
    }

  </style>

</head>


<body>

  <h1>MY LIBRARY</h1>

  <p>本のバーコードをスキャンしてください</p>

  <div id="reader"></div>

  <button id="startButton">
    カメラを起動
  </button>

  <div
    class="message"
    id="message"
  >
    「カメラを起動」を押してください
  </div>


<script>

  // =====================================
  // Apps Script WebアプリURL
  // =====================================

  const API_URL =
    "https://script.google.com/macros/s/AKfycby97RNFKErbRjwLSsmUhkgzwhFO1PxgFWnIBn8CAtv3bq79HKy2ly71bX-6Wa8J48ZOWw/exec";


  // =====================================
  // スキャナー
  // =====================================

  const html5QrCode =
    new Html5Qrcode("reader");


  // =====================================
  // 読み取り成功
  // =====================================

  function onScanSuccess(decodedText, decodedResult) {

    const isbn =
      String(decodedText)
        .replace(/\D/g, "");


    // -------------------------------------
    // ISBN-13か確認
    // -------------------------------------

    if (
      isbn.length !== 13 ||
      (
        !isbn.startsWith("978") &&
        !isbn.startsWith("979")
      )
    ) {

      document.getElementById("message").innerText =
        "ISBNバーコードではありません。";

      return;

    }


    // -------------------------------------
    // カメラ停止
    // -------------------------------------

    html5QrCode
      .stop()
      .catch(() => {});


    document.getElementById("message").innerText =
      "処理しています…";


    // -------------------------------------
    // 読書履歴処理
    // -------------------------------------

    const url =
      API_URL +
      "?mode=read&code=" +
      encodeURIComponent(isbn);


    window.location.href = url;

  }


  // =====================================
  // 読み取り失敗
  // =====================================

  function onScanFailure(error) {

    // 読み取り中のエラーは無視

  }


  // =====================================
  // カメラ起動
  // =====================================

  document
    .getElementById("startButton")
    .addEventListener(
      "click",
      function () {

        document.getElementById("message").innerText =
          "カメラを起動しています…";


        // ---------------------------------
        // 背面カメラを指定
        // ---------------------------------

        const cameraConfig = {
          facingMode: "environment"
        };


        // ---------------------------------
        // カメラ開始
        // ---------------------------------

        html5QrCode
          .start(
            cameraConfig,

            {
              fps: 10,

              qrbox: {
                width: 300,
                height: 150
              }

            },

            onScanSuccess,

            onScanFailure

          )

          .then(
            function () {

              document.getElementById("message").innerText =
                "バーコードをカメラに映してください。";

              document.getElementById("startButton").style.display =
                "none";

            }
          )

          .catch(
            function (error) {

              console.error(error);

              document.getElementById("message").innerText =
                "カメラを起動できませんでした。iPhoneの設定でカメラの許可を確認してください。";

            }
          );

      }
    );

</script>

</body>

</html>
