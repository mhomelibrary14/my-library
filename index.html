<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>MY LIBRARY</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        sans-serif;

      text-align: center;
      margin: 0;
      padding: 40px 20px;
      background: #fafafa;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #666;
    }

    .menu {
      max-width: 400px;
      margin: 40px auto;
    }

    .menu button {
      display: block;
      width: 100%;
      margin: 18px 0;
      padding: 20px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      background: #222;
      color: white;
    }

    .menu button.read {
      background: #555;
    }

    .menu button.finish {
      background: #777;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 30px auto;
    }

    #startButton {
      font-size: 18px;
      padding: 14px 30px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
    }

    .message {
      margin-top: 20px;
      font-size: 16px;
      color: #555;
    }

    .backButton {
      margin-top: 20px;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      background: #ddd;
      font-size: 16px;
    }

  </style>

</head>


<body>


  <!-- ================================= -->
  <!-- メニュー -->
  <!-- ================================= -->

  <div id="menu">

    <h1>MY LIBRARY</h1>

    <p>
      何をしますか？
    </p>


    <div class="menu">

      <button
        onclick="startScanner('register')"
      >
        📚 蔵書を登録する
      </button>


      <button
        class="read"
        onclick="startScanner('read_start')"
      >
        📖 読書を開始する
      </button>


      <button
        class="finish"
        onclick="startScanner('read_finish')"
      >
        ✅ 読了にする
      </button>

    </div>

  </div>


  <!-- ================================= -->
  <!-- スキャン画面 -->
  <!-- ================================= -->

  <div
    id="scannerArea"
    style="display:none;"
  >

    <h2 id="scannerTitle">
      📚 蔵書登録
    </h2>


    <p id="scannerDescription">
      本のバーコードをスキャンしてください。
    </p>


    <div id="reader"></div>


    <button id="startButton">
      カメラを起動
    </button>


    <div
      class="message"
      id="message"
    >
      「カメラを起動」を押してください。
    </div>


    <button
      class="backButton"
      onclick="backToMenu()"
    >
      ← 戻る
    </button>

  </div>


<script>


  // =====================================
  // Apps Script URL
  // =====================================

  const API_URL =
    "https://script.google.com/macros/s/AKfycby97RNFKErbRjwLSsmUhkgzwhFO1PxgFWnIBn8CAtv3bq79HKy2ly71bX-6Wa8J48ZOWw/exec";


  // =====================================
  // 現在のモード
  // =====================================

  let currentMode = "";


  // =====================================
  // スキャナー
  // =====================================

  let html5QrCode = null;


  // =====================================
  // スキャンモード開始
  // =====================================

  function startScanner(mode) {

    currentMode = mode;


    document.getElementById("menu").style.display =
      "none";


    document.getElementById("scannerArea").style.display =
      "block";


    // -----------------------------------
    // 画面表示
    // -----------------------------------

    if (mode === "register") {

      document.getElementById("scannerTitle").innerText =
        "📚 蔵書登録";

      document.getElementById("scannerDescription").innerText =
        "登録したい本のバーコードをスキャンしてください。";

    }


    if (mode === "read_start") {

      document.getElementById("scannerTitle").innerText =
        "📖 読書開始";

      document.getElementById("scannerDescription").innerText =
        "読み始める本のバーコードをスキャンしてください。";

    }


    if (mode === "read_finish") {

      document.getElementById("scannerTitle").innerText =
        "✅ 読了";

      document.getElementById("scannerDescription").innerText =
        "読み終わった本のバーコードをスキャンしてください。";

    }


    document.getElementById("message").innerText =
      "「カメラを起動」を押してください。";

  }


  // =====================================
  // メニューに戻る
  // =====================================

  function backToMenu() {

    if (html5QrCode) {

      html5QrCode
        .stop()
        .catch(() => {});

      html5QrCode = null;

    }


    document.getElementById("scannerArea").style.display =
      "none";


    document.getElementById("menu").style.display =
      "block";


    document.getElementById("startButton").style.display =
      "inline-block";


    document.getElementById("message").innerText =
      "「カメラを起動」を押してください。";

  }


  // =====================================
  // スキャン成功
  // =====================================

  function onScanSuccess(decodedText, decodedResult) {

    const isbn =
      String(decodedText)
        .replace(/\D/g, "");


    // -----------------------------------
    // ISBN-13確認
    // -----------------------------------

    if (
      isbn.length !== 13 ||
      (
        !isbn.startsWith("978") &&
        !isbn.startsWith("979")
      )
    ) {

      document.getElementById("message").innerText =
        "ISBNバーコードではありません。";

      return;

    }


    // -----------------------------------
    // カメラ停止
    // -----------------------------------

    if (html5QrCode) {

      html5QrCode
        .stop()
        .catch(() => {});

    }


    document.getElementById("message").innerText =
      "処理しています…";


    // ===================================
    // URL
    // ===================================

    let url =
      API_URL +
      "?code=" +
      encodeURIComponent(isbn);


    // -----------------------------------
    // 読書開始
    // -----------------------------------

    if (currentMode === "read_start") {

      url =
        API_URL +
        "?mode=read_start&code=" +
        encodeURIComponent(isbn);

    }


    // -----------------------------------
    // 読了
    // -----------------------------------

    if (currentMode === "read_finish") {

      url =
        API_URL +
        "?mode=read_finish&code=" +
        encodeURIComponent(isbn);

    }


    // ===================================
    // Apps Scriptへ
    // ===================================

    window.location.href =
      url;

  }


  // =====================================
  // スキャン失敗
  // =====================================

  function onScanFailure(error) {

    // 読み取り中のエラーは無視

  }


  // =====================================
  // カメラ起動
  // =====================================

  document
    .getElementById("startButton")
    .addEventListener(
      "click",
      function () {

        document.getElementById("message").innerText =
          "カメラを起動しています…";


        html5QrCode =
          new Html5Qrcode("reader");


        const cameraConfig = {
          facingMode: "environment"
        };


        html5QrCode
          .start(

            cameraConfig,

            {

              fps: 10,

              qrbox: {
                width: 300,
                height: 150
              }

            },

            onScanSuccess,

            onScanFailure

          )

          .then(

            function () {

              document.getElementById("message").innerText =
                "バーコードをカメラに映してください。";


              document.getElementById("startButton").style.display =
                "none";

            }

          )

          .catch(

            function (error) {

              console.error(error);


              document.getElementById("message").innerText =
                "カメラを起動できませんでした。";

            }

          );

      }

    );


</script>

</body>

</html>
