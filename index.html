<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>MY LIBRARY</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript">
  </script>

  <style>

    body {
      font-family: sans-serif;
      background: #f7f5f0;
      margin: 0;
      padding: 30px 20px;
      color: #333;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 30px;
    }

    .menu {
      display: grid;
      gap: 14px;
    }

    button {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 14px;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      font-size: 16px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .reader-area {
      margin-top: 25px;
      background: white;
      padding: 15px;
      border-radius: 14px;
    }

    #reader {
      width: 100%;
    }

    .back-button {
      margin-top: 15px;
      background: #eee;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>📚 MY LIBRARY</h1>

  <div class="subtitle">
    My Home Library
  </div>


  <div class="menu">

    <button onclick="startScanner('register')">
      📚 蔵書を登録する
    </button>

    <button onclick="startScanner('read_start')">
      📖 読書を開始する
    </button>

    <button onclick="startScanner('read_finish')">
      ✅ 読了にする
    </button>

    <button onclick="startScanner('wishlist_add')">
      ❤️ 読みたい本に追加する
    </button>

    <button onclick="openWishlist()">
      📋 読みたい本を見る
    </button>

    <button onclick="openSearch()">
      🔎 蔵書を検索する
    </button>

  </div>


  <div id="scannerArea"
       class="reader-area"
       style="display:none;">

    <div id="reader"></div>

    <button class="back-button"
            onclick="stopScanner()">
      ← 戻る
    </button>

  </div>

</div>


<script>

  const GAS_URL =
    "https://script.google.com/macros/s/AKfycby97RNFKErbRjwLSsmUhkgzwhFO1PxgFWnIBn8CAtv3bq79HKy2ly71bX-6Wa8J48ZOWw/exec";


  let html5QrCode = null;
  let currentMode = "";
  let scanning = false;


  /* =========================
     スキャナー開始
  ========================= */

  function startScanner(mode) {

    currentMode = mode;

    document.querySelector(".menu").style.display = "none";

    document.getElementById("scannerArea").style.display = "block";

    html5QrCode = new Html5Qrcode("reader");

    html5QrCode.start(

      { facingMode: "environment" },

      {
        fps: 10,
        qrbox: {
          width: 280,
          height: 160
        }
      },

      onScanSuccess,

      onScanFailure

    ).then(function() {

      scanning = true;

    }).catch(function(error) {

      alert(
        "カメラを起動できませんでした。\n\n" +
        "ブラウザのカメラ許可を確認してください。"
      );

      stopScanner();

    });

  }


  /* =========================
     バーコード読み取り成功
  ========================= */

  function onScanSuccess(decodedText, decodedResult) {

    if (!scanning) return;

    scanning = false;

    let code =
      String(decodedText)
        .replace(/[^\d]/g, "");

    /*
     * ISBN-13のみ受付
     * 978 / 979から始まる13桁
     */

    if (
      code.length !== 13 ||
      !(code.startsWith("978") ||
        code.startsWith("979"))
    ) {

      alert(
        "ISBN-13のバーコードではありません。\n\n" +
        "本の裏表紙にあるバーコードを読み取ってください。"
      );

      scanning = true;

      return;
    }


    stopScanner();


    let url = GAS_URL;


    if (currentMode === "register") {

      url +=
        "?code=" +
        encodeURIComponent(code);

    }


    else if (currentMode === "read_start") {

      url +=
        "?mode=read_start&code=" +
        encodeURIComponent(code);

    }


    else if (currentMode === "read_finish") {

      url +=
        "?mode=read_finish&code=" +
        encodeURIComponent(code);

    }


    else if (currentMode === "wishlist_add") {

      url +=
        "?mode=wishlist_add&code=" +
        encodeURIComponent(code);

    }


    window.location.href = url;

  }


  /* =========================
     読み取り失敗
  ========================= */

  function onScanFailure(error) {

    // 読み取り途中のエラーなので何もしない

  }


  /* =========================
     スキャナー停止
  ========================= */

  function stopScanner() {

    scanning = false;

    if (html5QrCode) {

      html5QrCode.stop()
        .then(function() {

          html5QrCode.clear();

        })
        .catch(function() {});

      html5QrCode = null;
    }

    document.getElementById("scannerArea").style.display = "none";

    document.querySelector(".menu").style.display = "grid";

  }


  /* =========================
     読みたい本リスト
  ========================= */

  function openWishlist() {

    const url =
      GAS_URL +
      "?mode=wishlist";

    window.location.href = url;

  }


  /* =========================
     蔵書検索
  ========================= */

  function openSearch() {

    const keyword = prompt(

      "検索したい本のタイトル・著者・ISBNを入力してください。\n\n" +

      "何も入力せずOKを押すと、すべての蔵書を表示します。"

    );


    if (keyword === null) return;


    const url =
      GAS_URL +
      "?mode=search&keyword=" +
      encodeURIComponent(keyword);


    window.location.href = url;

  }

</script>

</body>

</html>
