<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>MY LIBRARY</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        sans-serif;

      text-align: center;
      margin: 0;
      padding: 30px 20px;
      background: #fafafa;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #666;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 30px auto;
    }

    .message {
      margin-top: 20px;
      font-size: 16px;
    }

  </style>

</head>

<body>

  <h1>MY LIBRARY</h1>

  <p>本のバーコードをスキャンしてください</p>

  <div id="reader"></div>

  <div class="message" id="message">
    カメラを起動しています…
  </div>


  <script>

    // --------------------------------
    // Apps Script WebアプリURL
    // --------------------------------

    const API_URL =
      "https://script.google.com/macros/s/AKfycby97RNFKErbRjwLSsmUhkgzwhFO1PxgFWnIBn8CAtv3bq79HKy2ly71bX-6Wa8J48ZOWw/exec";


    // --------------------------------
    // スキャン成功
    // --------------------------------

    function onScanSuccess(decodedText, decodedResult) {

      const isbn = String(decodedText)
        .replace(/\D/g, "");

      // ISBN-13のみ受付
      if (
        isbn.length !== 13 ||
        (!isbn.startsWith("978") &&
         !isbn.startsWith("979"))
      ) {

        document.getElementById("message").innerText =
          "ISBNバーコードではありません。";

        return;
      }


      // 二重読み取り防止
      html5QrcodeScanner.clear();


      document.getElementById("message").innerText =
        "処理しています…";


      // --------------------------------
      // 読書履歴として処理
      // --------------------------------

     const url =
  API_URL +
  "?mode=read&code=" +
  encodeURIComponent(isbn);


      window.location.href = url;

    }


    // --------------------------------
    // スキャンエラー
    // --------------------------------

    function onScanFailure(error) {
      // 無視
    }


    // --------------------------------
    // カメラ起動
    // --------------------------------

    const html5QrcodeScanner =
      new Html5QrcodeScanner(

        "reader",

        {
          fps: 10,

          qrbox: {
            width: 280,
            height: 120
          },

          formatsToSupport: [
            Html5QrcodeSupportedFormats.EAN_13
          ]

        },

        false
      );


    html5QrcodeScanner.render(
      onScanSuccess,
      onScanFailure
    );

  </script>

</body>

</html>
