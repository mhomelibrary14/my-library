<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>MY LIBRARY</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript"></script>

  <style>

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      margin: 0;
      padding: 20px;
      background: #f7f7f7;
      color: #333;
    }

    h1 {
      text-align: center;
      margin: 10px 0 5px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      overflow: hidden;
    }

    button {
      display: block;
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      background: #333;
      color: white;
    }

    #result {
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 16px;
      box-sizing: border-box;
      display: none;
    }

    .title {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .info {
      line-height: 1.8;
      color: #555;
    }

  </style>

</head>


<body>

  <h1>📚 MY LIBRARY</h1>

  <div class="subtitle">
    本のバーコードをスキャン
  </div>


  <div id="reader"></div>


  <button id="startButton"
          onclick="startScanner()">

    📷 スキャン開始

  </button>


  <div id="result">

    <div class="title"
         id="title">
    </div>

    <div class="info"
         id="info">
    </div>

  </div>


<script>


  // =====================================
  // Apps ScriptのURL
  // =====================================

  const API_URL =
    "https://script.google.com/macros/s/AKfycby97RNFKErbRjwLSsmUhkgzwhFO1PxgFWnIBn8CAtv3bq79HKy2ly71bX-6Wa8J48ZOWw/exec";


  let scanner = null;

  let scanned = false;


  // =====================================
  // スキャン開始
  // =====================================

  function startScanner() {


    scanned = false;


    if (scanner) {

      try {

        scanner.clear();

      } catch (e) {

      }

    }


    document.getElementById("result")
      .style.display = "none";


    scanner =
      new Html5Qrcode("reader");


    const config = {

      fps: 10,

      qrbox: {

        width: 300,

        height: 150

      },

      formatsToSupport: [

        Html5QrcodeSupportedFormats.EAN_13

      ]

    };


    scanner.start(

      {
        facingMode: "environment"
      },

      config,


      // =================================
      // バーコード読み取り成功
      // =================================

      function(decodedText) {


        if (scanned) {

          return;

        }


        scanned = true;


        const isbn =
          decodedText.replace(/[^0-9]/g, "");


        // カメラ停止

        scanner.stop().catch(function() {});


        // 登録処理開始

        sendISBN(isbn);

      },


      function(errorMessage) {

        // 読み取り失敗は無視

      }

    )


    .catch(function(error) {

      alert(
        "カメラを起動できませんでした。\n\n" +
        error
      );

    });

  }


  // =====================================
  // Apps ScriptへISBN送信
  // =====================================

  function sendISBN(isbn) {


    document.getElementById("result")
      .style.display = "block";


    document.getElementById("title")
      .textContent = "⏳ 書籍情報を取得しています";


    document.getElementById("info")
      .textContent =
        "ISBN：" + isbn;


    fetch(API_URL, {

      method: "POST",

      headers: {

        "Content-Type": "text/plain;charset=utf-8"

      },

      body: JSON.stringify({

        code: isbn

      })

    })


    .then(function(response) {

      return response.json();

    })


    .then(function(result) {


      if (result.success) {


        document.getElementById("title")
          .textContent =
          "✅ " + result.title;


        document.getElementById("info")
          .innerHTML =

          "ISBN：" + result.isbn +

          "<br>" +

          "著者：" + result.author +

          "<br>" +

          "出版社：" + result.publisher +

          "<br><br>" +

          "📚 蔵書に登録しました！";


      } else {


        document.getElementById("title")
          .textContent =
          "⚠️ 登録できませんでした";


        document.getElementById("info")
          .textContent =
          result.message;

      }

    })


    .catch(function(error) {


      document.getElementById("title")
        .textContent =
        "❌ 通信エラー";


      document.getElementById("info")
        .textContent =
        error.toString();


    });

  }


</script>


</body>

</html>
