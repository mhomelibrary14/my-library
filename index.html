<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MY LIBRARY</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f6f4ef;
      color: #333;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Meiryo,
        sans-serif;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 28px 18px 50px;
    }

    /* --------------------
       ヘッダー
    -------------------- */

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 34px;
      font-weight: 600;
      letter-spacing: 2px;
      color: #292929;
    }

    .header p {
      margin: 8px 0 0;
      color: #888;
      font-size: 13px;
      letter-spacing: 1px;
    }

    /* --------------------
       セクション
    -------------------- */

    .section {
      margin-bottom: 26px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 11px;
      padding-left: 3px;
      font-size: 14px;
      font-weight: 700;
      color: #555;
      letter-spacing: 0.5px;
    }

    .section-title span {
      font-size: 18px;
    }

    /* --------------------
       カード
    -------------------- */

    .card {
      background: #fff;
      border: 1px solid #e8e4dc;
      border-radius: 16px;
      margin-bottom: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.035);
    }

    button {
      width: 100%;
      border: none;
      background: transparent;
      text-align: left;
      padding: 17px 18px;
      cursor: pointer;
      font-family: inherit;
      color: #333;
    }

    button:active {
      background: #f7f7f7;
    }

    .button-inner {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .icon {
      width: 43px;
      height: 43px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      font-size: 22px;
    }

    .icon-reading {
      background: #edf4ef;
    }

    .icon-wishlist {
      background: #f8eeee;
    }

    .icon-search {
      background: #edf2f7;
    }

    .icon-library {
      background: #f3f0e9;
    }

    .button-text {
      flex: 1;
      min-width: 0;
    }

    .button-title {
      display: block;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.4;
    }

    .button-description {
      display: block;
      margin-top: 3px;
      font-size: 12px;
      color: #999;
      line-height: 1.4;
    }

    .arrow {
      color: #bbb;
      font-size: 20px;
      padding-left: 5px;
    }

    /* --------------------
       メインアクション
    -------------------- */

    .primary-card {
      background: #3f6250;
      border: none;
      box-shadow: 0 4px 14px rgba(63, 98, 80, 0.18);
    }

    .primary-card button {
      color: #fff;
      padding: 20px 18px;
    }

    .primary-card .icon {
      background: rgba(255, 255, 255, 0.14);
    }

    .primary-card .button-title {
      font-size: 16px;
    }

    .primary-card .button-description {
      color: rgba(255, 255, 255, 0.72);
    }

    .primary-card .arrow {
      color: rgba(255, 255, 255, 0.65);
    }

    /* --------------------
       2列レイアウト
    -------------------- */

    .two-column {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .two-column .card {
      margin-bottom: 0;
    }

    .two-column button {
      padding: 16px 14px;
    }

    .two-column .button-inner {
      display: block;
    }

    .two-column .icon {
      margin-bottom: 11px;
    }

    .two-column .button-title {
      font-size: 14px;
    }

    .two-column .button-description {
      font-size: 11px;
    }

    .two-column .arrow {
      display: none;
    }

    /* --------------------
       フッター
    -------------------- */

    .footer {
      text-align: center;
      margin-top: 38px;
      color: #aaa;
      font-size: 11px;
      letter-spacing: 1px;
    }

    /* --------------------
       スマホ
    -------------------- */

    @media (max-width: 420px) {
      .container {
        padding: 24px 14px 40px;
      }

      .header h1 {
        font-size: 30px;
      }

      .two-column button {
        padding: 15px 13px;
      }

      .icon {
        width: 40px;
        height: 40px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- ヘッダー -->

    <header class="header">
      <h1>MY LIBRARY</h1>
      <p>MY PERSONAL BOOK LIBRARY</p>
    </header>


    <!-- ====================
         本を管理する
    ===================== -->

    <section class="section">

      <h2 class="section-title">
        <span>📚</span>
        本を管理する
      </h2>

      <div class="card primary-card">
        <button onclick="startScanner('register')">
          <div class="button-inner">

            <div class="icon">
              📚
            </div>

            <div class="button-text">
              <span class="button-title">
                蔵書を登録する
              </span>

              <span class="button-description">
                本のバーコードを読み取って登録
              </span>
            </div>

            <div class="arrow">
              ›
            </div>

          </div>
        </button>
      </div>

    </section>


    <!-- ====================
         読書
    ===================== -->

    <section class="section">

      <h2 class="section-title">
        <span>📖</span>
        読書
      </h2>

      <div class="two-column">

        <div class="card">
          <button onclick="startScanner('read_start')">

            <div class="button-inner">

              <div class="icon icon-reading">
                📖
              </div>

              <div class="button-text">

                <span class="button-title">
                  読書を開始する
                </span>

                <span class="button-description">
                  読み始めた本を記録
                </span>

              </div>

              <div class="arrow">
                ›
              </div>

            </div>

          </button>
        </div>


        <div class="card">
          <button onclick="startScanner('read_finish')">

            <div class="button-inner">

              <div class="icon icon-reading">
                ✅
              </div>

              <div class="button-text">

                <span class="button-title">
                  読了にする
                </span>

                <span class="button-description">
                  読み終えた本を記録
                </span>

              </div>

              <div class="arrow">
                ›
              </div>

            </div>

          </button>
        </div>


        <div class="card">
          <button onclick="openHistory()">

            <div class="button-inner">

              <div class="icon icon-reading">
                📚
              </div>

              <div class="button-text">

                <span class="button-title">
                  読書履歴
                </span>

                <span class="button-description">
                  これまで読んだ本を見る
                </span>

              </div>

              <div class="arrow">
                ›
              </div>

            </div>

          </button>
        </div>

      </div>

    </section>


    <!-- ====================
         読みたい本
    ===================== -->

    <section class="section">

      <h2 class="section-title">
        <span>❤️</span>
        読みたい本
      </h2>

      <div class="two-column">

        <div class="card">
          <button onclick="startScanner('wishlist_add')">

            <div class="button-inner">

              <div class="icon icon-wishlist">
                ❤️
              </div>

              <div class="button-text">

                <span class="button-title">
                  読みたい本に追加
                </span>

                <span class="button-description">
                  気になる本を登録
                </span>

              </div>

              <div class="arrow">
                ›
              </div>

            </div>

          </button>
        </div>


        <div class="card">
          <button onclick="openWishlist()">

            <div class="button-inner">

              <div class="icon icon-wishlist">
                📋
              </div>

              <div class="button-text">

                <span class="button-title">
                  読みたい本を見る
                </span>

                <span class="button-description">
                  読みたい本リスト
                </span>

              </div>

              <div class="arrow">
                ›
              </div>

            </div>

          </button>
        </div>

      </div>

    </section>


    <!-- ====================
         探す
    ===================== -->

    <section class="section">

      <h2 class="section-title">
        <span>🔎</span>
        探す
      </h2>

      <div class="card">

        <button onclick="openSearch()">

          <div class="button-inner">

            <div class="icon icon-search">
              🔎
            </div>

            <div class="button-text">

              <span class="button-title">
                蔵書を検索する
              </span>

              <span class="button-description">
                タイトル・著者・ISBNから検索
              </span>

            </div>

            <div class="arrow">
              ›
            </div>

          </div>

        </button>

      </div>

    </section>


    <div class="footer">
      MY LIBRARY
    </div>

  </div>


  <!-- ====================
       バーコード読み取り画面
  ===================== -->

  <div
    id="scannerScreen"
    style="
      display:none;
      position:fixed;
      inset:0;
      background:#000;
      z-index:9999;
    "
  >

    <div
      style="
        position:absolute;
        top:0;
        left:0;
        right:0;
        padding:18px;
        color:#fff;
        text-align:center;
        z-index:10000;
      "
    >

      <div
        id="scannerTitle"
        style="
          font-size:16px;
          font-weight:600;
          margin-bottom:5px;
        "
      >
        バーコードを読み取ってください
      </div>

      <div
        style="
          font-size:12px;
          opacity:.7;
        "
      >
        本の裏側にあるISBNバーコードをカメラに映してください
      </div>

    </div>


    <div
      id="reader"
      style="
        width:100%;
        max-width:600px;
        margin:0 auto;
        padding-top:100px;
      "
    ></div>


    <button
      onclick="stopScanner()"
      style="
        position:absolute;
        bottom:30px;
        left:50%;
        transform:translateX(-50%);
        width:auto;
        padding:13px 28px;
        background:rgba(255,255,255,.92);
        color:#333;
        border-radius:30px;
        font-size:14px;
        font-weight:600;
      "
    >
      閉じる
    </button>

  </div>


  <script>

    /* =====================================
       Google Apps Script URL
    ===================================== */

    const GAS_URL =
      "https://script.google.com/macros/s/AKfycby97RNFKErbRjwLSsmUhkgzwhFO1PxgFWnIBn8CAtv3bq79HKy2ly71bX-6Wa8J48ZOWw/exec";


    /* =====================================
       現在の操作モード
    ===================================== */

    let currentMode = "";

    let html5QrCode = null;


    /* =====================================
       バーコード読み取り開始
    ===================================== */

    function startScanner(mode) {

      currentMode = mode;

      const scannerScreen =
        document.getElementById("scannerScreen");

      scannerScreen.style.display = "block";


      const title =
        document.getElementById("scannerTitle");


      if (mode === "register") {

        title.textContent =
          "登録する本のバーコードを読み取ってください";

      } else if (mode === "read_start") {

        title.textContent =
          "読み始める本のバーコードを読み取ってください";

      } else if (mode === "read_finish") {

        title.textContent =
          "読了する本のバーコードを読み取ってください";

      } else if (mode === "wishlist_add") {

        title.textContent =
          "読みたい本のバーコードを読み取ってください";

      }


      setTimeout(function() {

        html5QrCode =
          new Html5Qrcode("reader");


        html5QrCode
          .start(

            {
              facingMode: "environment"
            },

            {
              fps: 10,

              qrbox: {
                width: 280,
                height: 160
              }

            },

            onScanSuccess,

            function(errorMessage) {
              // 読み取り中のエラーは無視
            }

          )
          .catch(function(err) {

            alert(
              "カメラを起動できませんでした。\n\n" +
              "ブラウザのカメラ使用許可を確認してください。"
            );

            stopScanner();

          });

      }, 200);

    }


    /* =====================================
       バーコード読み取り成功
    ===================================== */

    function onScanSuccess(decodedText) {

      let code =
        decodedText.replace(/\D/g, "");


      /*
       * ISBN-13だけを対象
       */

      if (
        code.length !== 13 ||
        (
          !code.startsWith("978") &&
          !code.startsWith("979")
        )
      ) {

        return;

      }


      /*
       * 二重読み取り防止
       */

      if (currentMode === "") {
        return;
      }


      const mode =
        currentMode;


      currentMode = "";


      stopScanner();


      /*
       * 少し待ってから遷移
       */

      setTimeout(function() {

        let url = GAS_URL;


        if (mode === "register") {

          url +=
            "?code=" +
            encodeURIComponent(code);

        }

        else if (mode === "read_start") {

          url +=
            "?mode=read_start&code=" +
            encodeURIComponent(code);

        }

        else if (mode === "read_finish") {

          url +=
            "?mode=read_finish&code=" +
            encodeURIComponent(code);

        }

        else if (mode === "wishlist_add") {

          url +=
            "?mode=wishlist_add&code=" +
            encodeURIComponent(code);

        }


        window.location.href = url;

      }, 300);

    }


    /* =====================================
       バーコード読み取り終了
    ===================================== */

    function stopScanner() {

      if (html5QrCode) {

        html5QrCode
          .stop()
          .then(function() {

            html5QrCode.clear();

            html5QrCode = null;

          })
          .catch(function() {

            html5QrCode = null;

          });

      }


      document.getElementById(
        "reader"
      ).innerHTML = "";


      document.getElementById(
        "scannerScreen"
      ).style.display = "none";


      currentMode = "";

    }


    /* =====================================
       読みたい本リスト
    ===================================== */

    function openWishlist() {

      const url =
        GAS_URL +
        "?mode=wishlist";

      window.location.href = url;

    }


    /* =====================================
       読書履歴
    ===================================== */

    function openHistory() {

      const url =
        GAS_URL +
        "?mode=history";

      window.location.href = url;

    }


    /* =====================================
       蔵書検索
    ===================================== */

    function openSearch() {

      const keyword =
        prompt(
          "検索したい本のタイトル・著者・ISBNを入力してください。\n\n" +
          "何も入力せずOKを押すと、すべての蔵書を表示します。"
        );


      if (keyword === null) {
        return;
      }


      const url =
        GAS_URL +
        "?mode=search&keyword=" +
        encodeURIComponent(keyword);


      window.location.href = url;

    }

  </script>

</body>
</html>
