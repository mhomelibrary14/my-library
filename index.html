<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>MY LIBRARY</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      background: #f7f7f7;
    }

    h1 {
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      background: white;
    }

    #result {
      margin-top: 20px;
      padding: 20px;
      background: white;
      border-radius: 10px;
    }

  </style>

</head>


<body>

<h1>📚 MY LIBRARY</h1>


<div id="reader"></div>


<div id="result">

  <div id="title">
    バーコードを読み取ってください
  </div>

  <div id="info"></div>

</div>


<!-- Apps Scriptへの送信用 -->

<iframe
  name="librarySubmit"
  id="librarySubmit"
  style="display:none;">
</iframe>


<form
  id="libraryForm"
  method="POST"
  target="librarySubmit"
  style="display:none;">

  <input
    type="hidden"
    name="code"
    id="isbnInput">

</form>


<script>


const API_URL =
  "https://script.google.com/macros/s/AKfycby97RNFKErbRjwLSsmUhkgzwhFO1PxgFWnIBn8CAtv3bq79HKy2ly71bX-6Wa8J48ZOWw/exec";


let scanner = null;

let scanning = false;


/* -------------------------
   画面表示
------------------------- */

function showResult(title, info) {

  document.getElementById("title").textContent = title;

  document.getElementById("info").innerHTML = info;

}


/* -------------------------
   Apps Scriptへ送信
------------------------- */

function sendISBN(isbn) {

  showResult(
    "📖 登録しています...",
    "ISBN：" + isbn
  );


  document.getElementById("isbnInput").value = isbn;


  document.getElementById("libraryForm").action =
    API_URL;


  document.getElementById("libraryForm").submit();


  /*
   * フォーム送信はブラウザの標準機能なので、
   * CORSの影響を受けません。
   *
   * 少し待ってから登録完了画面を表示します。
   */

  setTimeout(function() {

    showResult(
      "📚 登録処理を実行しました",
      "ISBN：" + isbn +
      "<br><br>" +
      "蔵書シートを確認してください。"
    );

  }, 1500);

}


/* -------------------------
   バーコード読み取り成功
------------------------- */

function onScanSuccess(decodedText) {

  if (!scanning) {
    return;
  }


  const code =
    decodedText
      .toString()
      .replace(/[^0-9]/g, "");


  /*
   * ISBN-13は978または979から始まる
   *
   * それ以外のEAN-13は無視する。
   */

  if (
    code.length !== 13 ||
    (!code.startsWith("978") &&
     !code.startsWith("979"))
  ) {

    showResult(
      "🔍 別のバーコードです",
      "ISBNバーコードを読み取ってください。"
    );

    return;

  }


  scanning = false;


  if (scanner) {

    scanner.stop().catch(function(error) {

      console.log(error);

    });

  }


  showResult(
    "🔍 ISBN読み取り成功！",
    "ISBN：" + code
  );


  sendISBN(code);

}


/* -------------------------
   読み取り中のエラー
------------------------- */

function onScanError(errorMessage) {

  // 読み取り中のエラーは無視

}


/* -------------------------
   カメラ開始
------------------------- */

function startScanner() {

  scanning = true;


  scanner =
    new Html5Qrcode("reader");


  const config = {

    fps: 10,

    qrbox: {
      width: 280,
      height: 150
    },

    formatsToSupport: [

      Html5QrcodeSupportedFormats.EAN_13

    ]

  };


  scanner.start(

    {
      facingMode: "environment"
    },

    config,

    onScanSuccess,

    onScanError

  )

  .catch(function(error) {

    showResult(
      "❌ カメラを起動できません",
      error
    );

  });

}


/* -------------------------
   ページ読み込み
------------------------- */

window.onload = function() {

  startScanner();

};


</script>

</body>

</html>
